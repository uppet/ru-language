name: Interpreter explicit stack acceptance
on:
  push:
    branches: [feature/interpreter-stack-20261025, wip]
  pull_request:
permissions:
  contents: read
concurrency:
  group: interpreter-stack-${{ github.ref }}
  cancel-in-progress: false
jobs:
  stack:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ['3.10', '3.12', '3.14']
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - name: Required failure-recording and no-false-green runner contracts
        run: python -m unittest discover -s tests -p test_interpreter_stack_ci.py -v
      - name: Every required case in isolated faulthandler child, no skips
        run: python tools/verify_interpreter_stack.py --out bin/interpreter-stack
      - name: Record existing interpreter performance cases, no changed thresholds
        if: always()
        run: python tools/benchmark.py --json --repeat 3
      - name: Preserve source identities and failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: interpreter-stack-${{ matrix.os }}-${{ matrix.python }}-${{ github.sha }}
          path: bin/interpreter-stack
          if-no-files-found: error
