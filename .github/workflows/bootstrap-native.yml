name: Bootstrap native isolated acceptance

on:
  push:
    branches: [feature/bootstrap-native-20261022]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-bootstrap:
    # New isolated acceptance only; existing CI and editor performance deadlines
    # remain unchanged. No release, tag, merge, packaging, or GUI claim here.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    defaults:
      run:
        working-directory: language
    env:
      PYTHONUTF8: '1'
      CC: gcc
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - name: Exact candidate checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: language
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'
      - name: Install Linux LLVM 14
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y clang-14 llvm-14
      - name: Prepare pinned project-local Windows LLVM 14
        if: runner.os == 'Windows'
        run: python tools/prepare_workspace.py --with-llvm
      - name: Check independent C fixture compiler
        run: gcc --version
      - name: Check LLVM toolchain
        run: python -c "from rulang.llvm_toolchain import LLVMToolchain; print(LLVMToolchain().version)"
      - name: Host safety contracts
        run: python -m unittest discover -s tests -p test_bootstrap_native_host.py -v
      - name: Fail-closed CI evidence checker unit tests
        run: python -m unittest discover -s tests -p test_bootstrap_native_ci.py -v
      - name: Build stage1, stage2, stage3 and verify existing complete M4 suite
        run: python tools/bootstrap.py verify --directory bin/bootstrap/native-ci
      - name: Require 105 actual passes, zero skips, IR/ABI/native fixed point
        run: python tools/verify_bootstrap_native_ci.py report --directory bin/bootstrap/native-ci
      - name: Stage3 native frontend positive and fail-closed negative contracts
        run: python tools/verify_bootstrap_native_ci.py frontend --directory bin/bootstrap/native-ci
      - name: Real Win64 DLL calls, callbacks, GC, owner, reentry and errors
        if: runner.os == 'Windows'
        run: python tools/verify_bootstrap_native_ci.py windows --directory bin/bootstrap/native-ci
      - name: Checkout exact public editor baseline, not current main or wij
        if: runner.os == 'Windows'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: uppet/ru_notepad
          ref: d964ea9f7e27065aa5bbcced8d6c7526a6224dd1
          path: editor
          persist-credentials: false
      - name: Stage3 complete d964 editor graph and LLVM console link (not GUI acceptance)
        if: runner.os == 'Windows'
        run: python tools/verify_bootstrap_native_ci.py editor --directory bin/bootstrap/native-ci --editor-root ../editor
      - name: Preserve native build identities and partial evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bootstrap-native-${{ matrix.os }}-${{ github.sha }}
          path: language/bin/bootstrap/native-ci/
          if-no-files-found: error
          retention-days: 14

  bootstrap-editor-gui:
    # Isolated functional evidence only; never a release or a replacement for
    # the existing editor's 30/120-second performance/product acceptance gates.
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: language
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      CC: gcc
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
      EDITOR_COMMIT: bc06efe06f1c013e91223e3a2db6a9160d68ed5d
      EDITOR_TREE: 20a50caf71487c73554aeb7dffad7f322232089a
    steps:
      - name: Exact language second-stage checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: language
          persist-credentials: false
      - name: Exact d964 plus isolated eleven-file pipeline checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: uppet/ru_notepad
          ref: bc06efe06f1c013e91223e3a2db6a9160d68ed5d
          path: editor-bootstrap
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.10'
      - name: Prepare native DLL-only MinGW tools
        id: gui-msys2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
      - name: Set real x64 SDK and CRT environment
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs -or $LASTEXITCODE) { throw 'x64 Visual Studio tools unavailable' }
          $vars = & cmd.exe /d /s /c "call `"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && set"
          if ($LASTEXITCODE) { throw 'vcvars64 failed' }
          $allow = @('PATH','INCLUDE','LIB','LIBPATH','WindowsSdkDir','WindowsSDKVersion','VCToolsInstallDir','VCToolsVersion')
          foreach ($line in $vars) {
            $pair = $line -split '=', 2
            if ($pair.Length -eq 2 -and $allow -contains $pair[0]) { "$($pair[0])=$($pair[1])" >> $env:GITHUB_ENV }
          }
          $owned = Join-Path ([System.IO.Path]::GetFullPath($env:RUNNER_TEMP)) 'bootstrap-gui-evidence'
          if (Test-Path $owned) { throw 'Expected fresh private evidence directory' }
          New-Item -ItemType Directory $owned | Out-Null
          "GUI_EVIDENCE=$owned" >> $env:GITHUB_ENV
      - name: Prepare pinned LLVM 14 and execute native toolchain self-check
        run: python tools/prepare_workspace.py --with-llvm
      - name: Lock exact sources and all application/helper tools before bootstrap
        env:
          GUI_MSYS_ROOT: ${{ steps.gui-msys2.outputs.msys2-location }}
        run: |
          @'
          import hashlib,json,os,subprocess,sys
          from pathlib import Path
          from rulang.llvm_toolchain import LLVMToolchain
          ru=Path.cwd().resolve(); app=(ru.parent/'editor-bootstrap').resolve(); out=Path(os.environ['GUI_EVIDENCE']).resolve()
          def require(condition,message):
              if not condition: raise RuntimeError(message)
          def git(root,*args): return subprocess.check_output(['git','-C',str(root),*args],text=True,encoding='utf-8').strip()
          def pin(root,expected):
              actual=git(root,'rev-parse','HEAD'); require(actual==expected,'unexpected checkout HEAD: '+actual)
              require(not git(root,'status','--porcelain','--untracked-files=all'),'dirty source')
              return {'path':str(root),'commit':actual,'tree':git(root,'rev-parse','HEAD^{tree}')}
          language=pin(ru,os.environ['GITHUB_SHA']); editor=pin(app,os.environ['EDITOR_COMMIT'])
          require(editor['tree']==os.environ['EDITOR_TREE'],'unexpected editor tree')
          t=LLVMToolchain(); require(len(t.clang)==1,'unexpected compiler argv')
          tools={'clang':str(Path(t.clang[0]).resolve()),**{k:str(Path(v).resolve()) for k,v in t.tools.items()},
            'linker':str((Path(os.environ['VCToolsInstallDir'])/'bin/Hostx64/x64/link.exe').resolve()),
            'resource-compiler':str((Path(os.environ['WindowsSdkDir'])/'bin'/os.environ['WindowsSDKVersion'].rstrip('\\/')/'x64/rc.exe').resolve())}
          mingw=Path(os.environ['GUI_MSYS_ROOT'])/'mingw64/bin'
          native={k:str((mingw/v).resolve()) for k,v in {'cc':'gcc.exe','cxx':'g++.exe','make':'mingw32-make.exe','windres':'windres.exe','ar':'ar.exe','ranlib':'ranlib.exe','objdump':'objdump.exe'}.items()}
          def hashes(paths):
              result={}
              for key,value in paths.items():
                  p=Path(value); require(p.is_file() and not p.is_symlink(),'unsafe tool path: '+value)
                  result[key]=hashlib.sha256(p.read_bytes()).hexdigest()
              return result
          config={'schema':'ru-notepad-bootstrap-llvm-config-v1','ru_source':language,'app_source':editor,
            'app_baseline':{'commit':'d964ea9f7e27065aa5bbcced8d6c7526a6224dd1','tree':'2522d03114c808480e42911be850b75e0ae14206'},
            'bootstrap_directory':str(ru/'bin/bootstrap/gui-ci'),'verification':str(ru/'bin/bootstrap/gui-ci/verification.json'),
            'tool_paths':tools,'tool_sha256':hashes(tools),'mingw_tool_paths':native,'mingw_tool_sha256':hashes(native)}
          (out/'base-config.json').write_text(json.dumps(config,indent=2),encoding='utf-8')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f:
              f.write('RU_LLVM_CLANG='+tools['clang']+'\n')
              f.write('PATH='+str(mingw)+';'+os.environ['PATH']+'\n')
          '@ | python -
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Pipeline policy and explicit linker host contracts
        run: |
          python -m unittest discover -s tests -p test_bootstrap_launcher_diagnostic.py -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_bootstrap_editor_diagnostic.py -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_bootstrap_native_host.py -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m unittest discover -s ../editor-bootstrap/tests -p 'test_bootstrap*.py' -v
      - name: Fixed-C production wrapper diagnostic only before editor bootstrap
        id: launcher_diag
        continue-on-error: true
        run: python tools/diagnose_bootstrap_launcher_windows.py --config "$env:GUI_EVIDENCE/base-config.json" --owned-root "$env:GUI_EVIDENCE/launcher-owned" --output "$env:GUI_EVIDENCE/launcher-preflight.json"
      - name: Upload early fixed-wrapper diagnostics without executable products
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fixed-wrapper-diagnostic-${{ github.sha }}
          path: |
            ${{ env.GUI_EVIDENCE }}/launcher-preflight.json
            ${{ env.GUI_EVIDENCE }}/launcher-owned/**/*.log
          if-no-files-found: warn
          retention-days: 14
      - name: Fresh three-stage bootstrap and complete fixed-point report
        run: python tools/bootstrap.py verify --directory bin/bootstrap/gui-ci
      - name: Independently require all 105 cases and native fixed point
        run: python tools/verify_bootstrap_native_ci.py report --directory bin/bootstrap/gui-ci
      - name: Build only pinned source DLLs and fixed-C native helpers
        run: python ../editor-bootstrap/tools/prepare_bootstrap_dependencies.py --config "$env:GUI_EVIDENCE/base-config.json" --output "$env:GUI_EVIDENCE/dependencies"
      - name: Stage3 LLVM build of actual editor and exact GUI probes
        id: gui_build
        run: |
          @'
          import json,os,subprocess,sys
          from pathlib import Path
          out=Path(os.environ['GUI_EVIDENCE']); base=json.loads((out/'base-config.json').read_text(encoding='utf-8'))
          app=Path(base['app_source']['path'])
          sys.path.insert(0,str(app/'tools'))
          import build_bootstrap_release as driver
          if Path(driver.__file__).resolve() != (app/'tools/build_bootstrap_release.py').resolve():
              raise RuntimeError('unexpected GUI driver source')
          for name,entry in [('app','src/main.ru'),('argv','tests/bootstrap_pipeline/argv_probe.ru'),('dll','tests/bootstrap_pipeline/dll_abi_probe.ru')]:
              config={**base,'entry_source':entry}; path=out/(name+'-config.json')
              path.write_text(json.dumps(config,indent=2),encoding='utf-8')
              try:
                  driver.build(config,out/name)
              except subprocess.CalledProcessError as error:
                  def text(value): return value.decode('utf-8','replace') if isinstance(value,bytes) else (value or '')
                  log=json.dumps({'command':error.cmd,'returncode':error.returncode},default=str)+'\n'+text(error.stdout)+'\n'+text(error.stderr)
                  (out/(name+'-build-failure.log')).write_text(log,encoding='utf-8')
                  raise
          gate={key:str(out/name/'build-receipt.json') for key,name in [('app_receipt','app'),('argv_probe_receipt','argv'),('dll_probe_receipt','dll')]}
          gate.update(dependencies_receipt=str(out/'dependencies/dependencies-receipt.json'),owned_root=str(out/'owned-runtime'))
          (out/'gate-config.json').write_text(json.dumps(gate,indent=2),encoding='utf-8')
          '@ | python -
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Real owned-process GUI resources Unicode argv DLL ABI callbacks and window lifecycle
        run: python ../editor-bootstrap/tools/verify_bootstrap_editor_windows.py --config "$env:GUI_EVIDENCE/gate-config.json" --output "$env:GUI_EVIDENCE/gui-acceptance.json"
      - name: Same-runner C control versus bootstrap fixture diagnostic only
        if: ${{ !cancelled() && steps.gui_build.outcome == 'success' }}
        run: |
          @'
          import json,os
          from pathlib import Path
          out=Path(os.environ['GUI_EVIDENCE'])
          base=json.loads((out/'base-config.json').read_bytes())
          gate=json.loads((out/'gate-config.json').read_bytes())
          config={'editor_root':base['app_source']['path'],'gate_config':gate,'owned_root':str(out/'controlled-runtime')}
          (out/'controlled-config.json').write_text(json.dumps(config,indent=2),encoding='utf-8')
          '@ | python -
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/diagnose_bootstrap_editor_fixture.py --config "$env:GUI_EVIDENCE/controlled-config.json" --output "$env:GUI_EVIDENCE/controlled-diagnostic.json"
      - name: Preserve fixed-wrapper diagnostic failure after the real editor gates
        if: always()
        run: |
          if ('${{ steps.launcher_diag.outcome }}' -ne 'success') { exit 1 }
      - name: Preserve JSON and logs only, never runtime binaries or packages
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bootstrap-editor-gui-evidence-${{ github.sha }}
          path: |
            ${{ runner.temp }}/bootstrap-gui-evidence/**/*.json
            ${{ runner.temp }}/bootstrap-gui-evidence/**/*.log
            language/bin/bootstrap/gui-ci/verification.json
          if-no-files-found: error
          retention-days: 14
