name: CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
        shard: [0, 1, 2]
    env:
      CC: gcc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check C compiler
        run: gcc --version
      - name: Check Node.js 18 or newer
        run: |
          node --version
          node -e 'if (Number(process.versions.node.split(".")[0]) < 18) process.exit(1)'
      - name: Run regression shard
        run: python tools/run_test_shard.py --shard ${{ matrix.shard }} --count 3 --failfast
      - name: Record interpreter benchmarks
        if: matrix.shard == 0
        run: python tools/benchmark.py
      - name: Test offline notebook editor
        run: node --test rushu/tests/*.mjs
      - name: Build all examples
        run: make examples
      - name: Build and syntax-check JavaScript examples
        run: make examples-js
  emacs:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Emacs
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y emacs-nox
      - name: Check Emacs version
        run: emacs --version
      - name: Byte-compile and run ERT
        run: make test-emacs
  llvm-aot:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
      - name: Install matching LLVM 14 tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang-14 llvm-14
      - name: Prepare project-local Windows LLVM 14
        if: runner.os == 'Windows'
        run: python tools/prepare_workspace.py --with-llvm
      - name: Check tools, native AOT and Ru self-compilation
        run: |
          python -c "from rulang.llvm_toolchain import LLVMToolchain; print(LLVMToolchain().version)"
          python -m unittest discover -s tests -p test_toolchain_environment.py -v
          python -m unittest discover -s tests -p test_bootstrap_verifier.py -v
          python -m unittest discover -s tests -p test_prepare_workspace.py -v
          python -m unittest discover -s tests -p test_llvm.py -v
          python tools/bootstrap.py verify
      - name: Bootstrap from Windows Git Bash with POSIX search paths
        if: runner.os == 'Windows'
        shell: bash
        run: |
          export INCLUDE='C:/msys64/usr/include/:C:/msys64/include/:'
          export LIB='C:/msys64/usr/lib/:'
          export CPATH='/usr/include:/mingw64/include'
          unset PYTHONUTF8 PYTHONIOENCODING
          python tools/prepare_workspace.py --with-llvm
          python tools/bootstrap.py verify --directory bin/bootstrap/git-bash
          python tools/bootstrap.py build examples/hello.ru --compiler bin/bootstrap/git-bash/stage3.exe -o bin/hello-git-bash.exe
          ./bin/hello-git-bash.exe
  windows-console:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run Windows regression shard
        env:
          PYTHONUTF8: "1"
          CC: gcc
        run: |
          gcc --version
          node --version
          python tools/run_test_shard.py --shard ${{ matrix.shard }} --count 3 --failfast
      - name: Test offline notebook editor
        run: node --test rushu/tests/*.mjs
