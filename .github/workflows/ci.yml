name: CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-native-exit-contract:
    # CI-wrapper self-test only; this does not validate compiler/tool behavior.
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Inject expected native-process failure
        id: expected_failure
        # This is the only intentionally tolerated failure. Acceptance tests
        # below must never use continue-on-error.
        continue-on-error: true
        run: python -c "raise SystemExit(23)"
      - name: Run later successful native process
        id: later_success
        run: python -c "raise SystemExit(0)"
      - name: Verify later success did not overwrite the failure outcome
        if: always()
        env:
          FAILED_OUTCOME: ${{ steps.expected_failure.outcome }}
          FAILED_CONCLUSION: ${{ steps.expected_failure.conclusion }}
          LATER_OUTCOME: ${{ steps.later_success.outcome }}
          LATER_CONCLUSION: ${{ steps.later_success.conclusion }}
        run: python -c "import os; actual = tuple(os.environ[k] for k in ('FAILED_OUTCOME', 'FAILED_CONCLUSION', 'LATER_OUTCOME', 'LATER_CONCLUSION')); print(actual); assert actual == ('failure', 'success', 'success', 'success'), actual"
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
        shard: [0, 1, 2]
    env:
      CC: gcc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check C compiler
        run: gcc --version
      - name: Check Node.js 18 or newer
        run: |
          node --version
          node -e 'if (Number(process.versions.node.split(".")[0]) < 18) process.exit(1)'
      - name: Run regression shard
        run: python tools/run_test_shard.py --shard ${{ matrix.shard }} --count 3 --failfast
      - name: Record interpreter benchmarks
        if: matrix.shard == 0
        run: python tools/benchmark.py
      - name: Test offline notebook editor
        run: node --test rushu/tests/*.mjs
      - name: Build all examples
        run: make examples
      - name: Build and syntax-check JavaScript examples
        run: make examples-js
  player-smoke:
    # 音频播放器冒烟（仅 player-ruaudio 分支携带本 job 与示例；
    # main 无播放器代码，本 job 在 main 上为 no-op 通过）。
    if: always() && contains(github.ref, 'player-ruaudio')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install SDL2 + mixer dev packages
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libsdl2-dev libsdl2-ttf-dev libsdl2-image-dev libsdl2-mixer-dev \
            pkg-config
      - name: Generate test media (WAV chunk + MP3 music)
        run: |
          python3 - <<'PY'
          import wave, struct, math
          with wave.open('examples/player/music/ci_beep.wav', 'wb') as w:
              w.setnchannels(1); w.setsampwidth(2); w.setframerate(22050)
              w.writeframes(b''.join(
                  struct.pack('<h', int(12000*math.sin(2*math.pi*440*t/22050)))
                  for t in range(22050//4)))
          # 极小合法 MP3：MPEG1-L3 128kbps 静音帧（mpg123 可解，验证 music 通道装载）
          frame = bytes([0xFF, 0xFB, 0x90, 0x00]) + bytes(413)
          with open('examples/player/music/ci_beep.mp3', 'wb') as f:
              f.write(frame * 12)
          PY
      - name: Build player (SDL target)
        run: RU_HEADLESS_SMOKE=1 python3 -m rulang build examples/ruui-player.ru --target sdl -o /tmp/player
      - name: Headless smoke run
        run: SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy RU_SMOKE_FRAMES=6 /tmp/player

  # Windows 交叉编译锁：sdl_host.c 的 _WIN32 兼容层与 RU_SDL_CFLAGS/LIBS
  # 注入路径每次构建都过一遍，防止 POSIX-only 代码回溜进 SDL 目标。
    # Windows 参数注入路径锁：不经过 pkg-config，直接 RU_SDL_CFLAGS/LIBS
  # 指向 MSYS2 ucrt64 的 include/lib——覆盖无 pkg-config 工具链的用户
  # 场景（与 player-windows-native 互补），产物作为发行 artifact 留存。
  # 注：Linux 宿主交叉编译（apt mingw）在 runner 上 apt 慢到不可用，
  # 已由本任务取代；交叉路径以本机验证为准。
  player-windows-inject:
    if: always() && contains(github.ref, 'player-ruaudio')
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install MinGW toolchain (MSYS2 ucrt64, 无 SDL 包)
        shell: bash
        run: |
          /c/msys64/usr/bin/bash -lc "pacman -S --noconfirm --needed \
            mingw-w64-ucrt-x86_64-gcc \
            mingw-w64-ucrt-x86_64-pkgconf"
      - name: Fetch official SDL2 release zips (libsdl-org, win32-x64)
        shell: bash
        run: |
          set -e
          mkdir -p /c/sdl-sdk
          cd /c/sdl-sdk
          curl -fsSL -o SDL2.zip https://github.com/libsdl-org/SDL/releases/download/release-2.30.12/SDL2-devel-2.30.12-mingw.zip
          curl -fsSL -o SDL2_ttf.zip https://github.com/libsdl-org/SDL_ttf/releases/download/release-2.24.0/SDL2_ttf-devel-2.24.0-mingw.zip
          curl -fsSL -o SDL2_image.zip https://github.com/libsdl-org/SDL_image/releases/download/release-2.8.8/SDL2_image-devel-2.8.8-mingw.zip
          curl -fsSL -o SDL2_mixer.zip https://github.com/libsdl-org/SDL_mixer/releases/download/release-2.8.1/SDL2_mixer-devel-2.8.1-mingw.zip
          for f in SDL2 SDL2_ttf SDL2_image SDL2_mixer; do unzip -q -o $f.zip; done
          # 官方 devel zip 根目录即版本号目录。先落到本步 shell 变量，
          # 再写 GITHUB_ENV 供后续步骤——探针在同一步内只能读本步变量，
          # 写 GITHUB_ENV 不会回流当前 shell（曾致探针 -I 全空、SDL.h 找不到）。
          SDL2_DIR="$(cygpath -m $PWD/SDL2-2*/ | tr -d '\r')"
          TTF_DIR="$(cygpath -m $PWD/SDL2_ttf-*/ | tr -d '\r')"
          IMG_DIR="$(cygpath -m $PWD/SDL2_image-*/ | tr -d '\r')"
          MIX_DIR="$(cygpath -m $PWD/SDL2_mixer-*/ | tr -d '\r')"
          echo "SDK_SDL2=$SDL2_DIR" >> "$GITHUB_ENV"
          echo "SDK_TTF=$TTF_DIR" >> "$GITHUB_ENV"
          echo "SDK_IMG=$IMG_DIR" >> "$GITHUB_ENV"
          echo "SDK_MIX=$MIX_DIR" >> "$GITHUB_ENV"
          grep SDK_ "$GITHUB_ENV"
          # 探针：同 flags 编一个含全部头的小文件，挂了就地报错
          printf '#include <SDL.h>\n#include <SDL_ttf.h>\n#include <SDL_image.h>\n#include <SDL_mixer.h>\nint main(int argc, char **argv){(void)argc;(void)argv;return 0;}\n' > probe.c
          C="-I$SDL2_DIR/x86_64-w64-mingw32/include/SDL2 -I$TTF_DIR/x86_64-w64-mingw32/include/SDL2 -I$IMG_DIR/x86_64-w64-mingw32/include/SDL2 -I$MIX_DIR/x86_64-w64-mingw32/include/SDL2"
          PATH="/c/msys64/ucrt64/bin:$PATH" sh -c "gcc $C -c probe.c -o probe.o" && echo PROBE-OK || { echo PROBE-FAIL; exit 1; }
      - name: Build player.exe (RU_SDL env injection, release 无 smoke 宏)
        shell: bash
        env:
          PYTHONUTF8: "1"
          RU_SDL_WITH_MIXER: "1"
        run: |
          # 发行 exe 严禁 RU_HEADLESS_SMOKE：smoke 构建会隐藏窗口并
          # 在 N 帧后静默退出（2026-10-27 真机踩过：看似闪退，实为自毁）
          export PATH="/c/msys64/ucrt64/bin:$PATH"
          export RU_SDL_CFLAGS="-I$SDK_SDL2/x86_64-w64-mingw32/include/SDL2 -I$SDK_TTF/x86_64-w64-mingw32/include/SDL2 -I$SDK_IMG/x86_64-w64-mingw32/include/SDL2 -I$SDK_MIX/x86_64-w64-mingw32/include/SDL2"
          export RU_SDL_LIBS="-L$SDK_SDL2/x86_64-w64-mingw32/lib -L$SDK_TTF/x86_64-w64-mingw32/lib -L$SDK_IMG/x86_64-w64-mingw32/lib -L$SDK_MIX/x86_64-w64-mingw32/lib -lSDL2 -lSDL2_ttf -lSDL2_image -lSDL2_mixer"
          CC=gcc python -m rulang build examples/ruui-player.ru --target sdl -o player.exe
          # 发行防呆：smoke 自毁路径的标记串不得出现在二进制里
          # （#ifdef 文本总在生成的 .c 里，查二进制才有效）
          if grep -aq "HEADLESS_SMOKE: %d frames" player.exe; then
            echo "smoke self-destruct leaked into release exe" >&2; exit 1
          fi
      - name: Stage release bundle (exe + DLL + music + usage)
        shell: bash
        run: |
          mkdir -p dist/examples/player/music
          cp player.exe dist/
          cp "$SDK_SDL2/x86_64-w64-mingw32/bin/SDL2.dll" \
             "$SDK_TTF/x86_64-w64-mingw32/bin/SDL2_ttf.dll" \
             "$SDK_IMG/x86_64-w64-mingw32/bin/SDL2_image.dll" \
             "$SDK_MIX/x86_64-w64-mingw32/bin/SDL2_mixer.dll" dist/
          cp examples/player/music/* dist/examples/player/music/ 2>/dev/null || true
          cat > dist/用法.txt <<'EOF'
          如UI 播放器 v4 网易云暗色主题（player-ruaudio 分支，Windows x64）

          用法：
            1) 解压到任意目录
            2) 把音乐放进 examples/player/music/（支持 .wav / .mp3 / .ogg）
            3) 双击 player.exe（保持 exe 旁的目录结构；曲库按当前目录解析）

          界面：
            - 标题栏：当前曲目 + 播放状态；时间：已播 / 总时长（mm:ss）
            - 波形图：播放开始后自动生成（缓存为 <曲名>.波形.bmp，可删）
            - 进度条：拖动即定位；播完自动下一首
            - 曲库列表点击播放；音量滑杆；上一首/播放暂停/下一首；刷新曲库

          说明：
            - 首次播放生成波形缓存，mp3/ogg 大文件可能等一两秒
            - 字体用系统 C:/Windows/Fonts/msyh.ttc；可用环境变量 RU_FONT 指定
            - 中文路径/曲名 UTF-8 安全（宿主内全部宽字符 API）

          v4 更新（网易云暗色主题）：
            - 全局面板三层深灰 + 品牌红 #EC4141 点缀
            - 顶栏：品牌行「如声 · 本地音乐 · N 首」+ 分段控件
              （列表循环 / 单曲循环 / 刷新曲库）
            - 底栏：走带 ◀◀ ▶ ▶▶ 红色高亮 + 曲名时间 + 进度/音量条
            - 空闲时时间不再走表；未播放时曲行不显示 ▶ 误标记

          v3.2 修复：
            - 滚动列表之外的所有内容（时间、进度条、按钮）此前不可见——
              SDL host 裁剪恢复把"未启用裁剪"误恢复为空矩形，越滚越糟；
              现已修复，整窗 UI 完整可见
            - 按钮点击无响应实为视觉假象：事件已送达、画面被旧裁剪遮罩，
              本版一并解决
          EOF
      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: ru-player-windows
          path: dist/
          retention-days: 14

  # Windows 原生构建锁：MSYS2 ucrt64 工具链 + pkg-config 路径——这是
  # Windows 用户实际走的路线，比交叉编译更接近真实场景（含运行验证）。
  player-windows-native:
    if: always() && contains(github.ref, 'player-ruaudio')
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install MinGW toolchain (MSYS2 ucrt64, 无 SDL 包)
        shell: bash
        run: |
          /c/msys64/usr/bin/bash -lc "pacman -S --noconfirm --needed \
            mingw-w64-ucrt-x86_64-gcc \
            mingw-w64-ucrt-x86_64-pkgconf"
      - name: Fetch official SDL2 release zips (libsdl-org, win32-x64)
        shell: bash
        run: |
          set -e
          mkdir -p /c/sdl-sdk
          cd /c/sdl-sdk
          curl -fsSL -o SDL2.zip https://github.com/libsdl-org/SDL/releases/download/release-2.30.12/SDL2-devel-2.30.12-mingw.zip
          curl -fsSL -o SDL2_ttf.zip https://github.com/libsdl-org/SDL_ttf/releases/download/release-2.24.0/SDL2_ttf-devel-2.24.0-mingw.zip
          curl -fsSL -o SDL2_image.zip https://github.com/libsdl-org/SDL_image/releases/download/release-2.8.8/SDL2_image-devel-2.8.8-mingw.zip
          curl -fsSL -o SDL2_mixer.zip https://github.com/libsdl-org/SDL_mixer/releases/download/release-2.8.1/SDL2_mixer-devel-2.8.1-mingw.zip
          for f in SDL2 SDL2_ttf SDL2_image SDL2_mixer; do unzip -q -o $f.zip; done
          # 官方 devel zip 根目录即版本号目录；写 GITHUB_ENV 供后续步骤
          # cygpath -m 出 C:/... 正斜杠路径：gcc 原生可懂，不依赖 MSYS2
          # 环境变量路径转换的启发式（它对部分 /c/ 标记会漏转，曾致
          # SDL_ttf.h 找不到而 SDL.h 正常）。
          echo "SDK_SDL2=$(cygpath -m $PWD/SDL2-2*/ | tr -d '\r')" >> "$GITHUB_ENV"
          echo "SDK_TTF=$(cygpath -m $PWD/SDL2_ttf-*/ | tr -d '\r')" >> "$GITHUB_ENV"
          echo "SDK_IMG=$(cygpath -m $PWD/SDL2_image-*/ | tr -d '\r')" >> "$GITHUB_ENV"
          echo "SDK_MIX=$(cygpath -m $PWD/SDL2_mixer-*/ | tr -d '\r')" >> "$GITHUB_ENV"
          grep SDK_ "$GITHUB_ENV"
      - name: Build player.exe (native Windows gcc)
        shell: bash
        env:
          PYTHONUTF8: "1"
        run: |
          # ucrt64 置顶：gcc 取 MSYS2 的，避开镜像自带 Strawberry 工具链
          export PATH="/c/msys64/ucrt64/bin:$PATH"
          export RU_SDL_WITH_MIXER=1
          export RU_SDL_CFLAGS="-I$SDK_SDL2/x86_64-w64-mingw32/include/SDL2 -I$SDK_TTF/x86_64-w64-mingw32/include/SDL2 -I$SDK_IMG/x86_64-w64-mingw32/include/SDL2 -I$SDK_MIX/x86_64-w64-mingw32/include/SDL2"
          export RU_SDL_LIBS="-L$SDK_SDL2/x86_64-w64-mingw32/lib -L$SDK_TTF/x86_64-w64-mingw32/lib -L$SDK_IMG/x86_64-w64-mingw32/lib -L$SDK_MIX/x86_64-w64-mingw32/lib -lSDL2 -lSDL2_ttf -lSDL2_image -lSDL2_mixer"
          RU_HEADLESS_SMOKE=1 CC=gcc python -m rulang build examples/ruui-player.ru --target sdl -o player.exe
      - name: Native headless smoke
        shell: bash
        run: |
          # DLL 落到 exe 旁：git-bash 的 PATH 转换对混合 C:/ 条目不可靠，
          # 且 127 无任何输出可诊断——同目录加载是 Windows 首选路径，确定性强
          cp "$SDK_SDL2/x86_64-w64-mingw32/bin/SDL2.dll" \
             "$SDK_TTF/x86_64-w64-mingw32/bin/SDL2_ttf.dll" \
             "$SDK_IMG/x86_64-w64-mingw32/bin/SDL2_image.dll" \
             "$SDK_MIX/x86_64-w64-mingw32/bin/SDL2_mixer.dll" .
          # 诊断：跑之前先看 exe 声明了哪些 DLL
          x86_64-w64-mingw32-objdump -p player.exe | grep "DLL Name" || true
          export PATH="/c/msys64/ucrt64/bin:$PATH"
          SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy RU_SMOKE_FRAMES=6 ./player.exe
  emacs:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Emacs
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y emacs-nox
      - name: Check Emacs version
        run: emacs --version
      - name: Byte-compile and run ERT
        run: make test-emacs
  llvm-aot:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
      - name: Install matching LLVM 14 tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang-14 llvm-14
      - name: Prepare project-local Windows LLVM 14
        if: runner.os == 'Windows'
        run: python tools/prepare_workspace.py --with-llvm
      # Each native command must have its own step: on Windows PowerShell,
      # a later successful process can otherwise hide an earlier nonzero exit.
      - name: Check LLVM tools
        run: python -c "from rulang.llvm_toolchain import LLVMToolchain; print(LLVMToolchain().version)"
      - name: Test LLVM environment
        run: python -m unittest discover -s tests -p test_toolchain_environment.py -v
      - name: Test bootstrap verifier
        run: python -m unittest discover -s tests -p test_bootstrap_verifier.py -v
      - name: Test workspace preparation
        run: python -m unittest discover -s tests -p test_prepare_workspace.py -v
      - name: Test native LLVM AOT
        run: python -m unittest discover -s tests -p test_llvm.py -v
      - name: Verify Ru self-compilation
        run: python tools/bootstrap.py verify
      - name: Test AOT interpreter host
        run: python -m unittest discover -s tests -p test_interpreter_host.py -v
      - name: Test AOT notebook sessions
        run: python -m unittest discover -s tests -p test_rushu_native.py -v
      - name: Test direct LLVM Mi kernels
        run: python -m unittest discover -s tests -p test_mi_llvm.py -v
      - name: Test Mi UTF8 owner bridges
        run: python -m unittest discover -s tests -p test_mi_utf8.py -v
      - name: Test Windows LLVM callback lifecycle with frequent GC
        if: runner.os == 'Windows'
        env:
          PYTHONPATH: tests
        run: python -m unittest llvm_callback_cases -v
  windows-git-bash-bootstrap:
    # Keep this second full bootstrap independent of the LLVM acceptance budget.
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
      - name: Bootstrap from Windows Git Bash with POSIX search paths
        shell: bash
        run: |
          export INCLUDE='C:/msys64/usr/include/:C:/msys64/include/:'
          export LIB='C:/msys64/usr/lib/:'
          export CPATH='/usr/include:/mingw64/include'
          unset PYTHONUTF8 PYTHONIOENCODING
          python tools/prepare_workspace.py --with-llvm
          python tools/bootstrap.py verify --directory bin/bootstrap/git-bash
          python tools/bootstrap.py build examples/hello.ru --compiler bin/bootstrap/git-bash/stage3.exe -o bin/hello-git-bash.exe
          ./bin/hello-git-bash.exe
          python tools/build_rushu_kernel.py --compiler bin/bootstrap/git-bash/stage3.exe -o bin/rushu/git-bash-kernel.exe
          ./bin/rushu/git-bash-kernel.exe examples/factorial.ru
  windows-console:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check Windows C compiler
        run: gcc --version
      - name: Check Windows Node.js
        run: node --version
      - name: Run Windows regression shard
        env:
          PYTHONUTF8: "1"
          CC: gcc
        run: python tools/run_test_shard.py --shard ${{ matrix.shard }} --count 3 --failfast
      - name: Test offline notebook editor
        run: node --test rushu/tests/*.mjs
  mi-core:
    name: Mi core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    env:
      PYTHONUTF8: "1"
      CC: gcc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Check C compiler
        run: gcc --version
      - name: Check Node.js
        run: node --version
      - name: Checked source and differential kernels
        run: python experiments/mi_source/test_source.py
      - name: Real NativeMemory owner and failure cleanup
        run: python experiments/mi_borrow/test_bridge.py
      - name: Historical kernel regression
        run: python experiments/mi_kernel/test_kernel.py
      - name: UTF8 caller and synchronous native callback
        run: python -m unittest discover -s tests -p test_mi_utf8_c.py -v
      - name: CLI protection and default output contract
        run: python -m unittest discover -s tests -p test_mi_integration.py -v
      - name: Source bridge UBSan (Linux fixture only)
        if: runner.os == 'Linux'
        env:
          MI_UBSAN: "1"
        run: python experiments/mi_source/test_source.py
      - name: NativeMemory UBSan (Linux fixture only)
        if: runner.os == 'Linux'
        env:
          MI_UBSAN: "1"
        run: python experiments/mi_borrow/test_bridge.py
      - name: UTF8 callback UBSan (Linux fixture only)
        if: runner.os == 'Linux'
        env:
          MI_UBSAN: "1"
        run: python -m unittest discover -s tests -p test_mi_utf8_c.py -v
