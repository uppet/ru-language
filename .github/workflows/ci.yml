name: CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    env:
      CC: gcc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check C compiler
        run: gcc --version
      - name: Check Node.js 18 or newer
        run: |
          node --version
          node -e 'if (Number(process.versions.node.split(".")[0]) < 18) process.exit(1)'
      - name: Run regression tests
        run: make test
      - name: Build all examples
        run: make examples
      - name: Build and syntax-check JavaScript examples
        run: make examples-js
  emacs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Emacs
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y emacs-nox
      - name: Check Emacs version
        run: emacs --version
      - name: Byte-compile and run ERT
        run: make test-emacs
