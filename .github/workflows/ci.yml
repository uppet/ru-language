name: CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
        shard: [0, 1, 2]
    env:
      CC: gcc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check C compiler
        run: gcc --version
      - name: Check Node.js 18 or newer
        run: |
          node --version
          node -e 'if (Number(process.versions.node.split(".")[0]) < 18) process.exit(1)'
      - name: Run regression shard
        run: python tools/run_test_shard.py --shard ${{ matrix.shard }} --count 3 --failfast
      - name: Record interpreter benchmarks
        if: matrix.shard == 0
        run: python tools/benchmark.py
      - name: Test offline notebook editor
        run: node --test rushu/tests/*.mjs
      - name: Build all examples
        run: make examples
      - name: Build and syntax-check JavaScript examples
        run: make examples-js
  emacs:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Emacs
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y emacs-nox
      - name: Check Emacs version
        run: emacs --version
      - name: Byte-compile and run ERT
        run: make test-emacs
  windows-console:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check Windows C compiler
        run: gcc --version
      - name: Check Windows Node.js
        run: node --version
      - name: Run Windows regression shard
        env:
          PYTHONUTF8: "1"
          CC: gcc
        run: python tools/run_test_shard.py --shard ${{ matrix.shard }} --count 3 --failfast
      - name: Test offline notebook editor
        run: node --test rushu/tests/*.mjs
  mi-core:
    name: Mi core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    env:
      PYTHONUTF8: "1"
      CC: gcc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Check C compiler
        run: gcc --version
      - name: Check Node.js
        run: node --version
      - name: Checked source and differential kernels
        run: python experiments/mi_source/test_source.py
      - name: Real NativeMemory owner and failure cleanup
        run: python experiments/mi_borrow/test_bridge.py
      - name: Historical kernel regression
        run: python experiments/mi_kernel/test_kernel.py
      - name: UTF8 caller and synchronous native callback
        run: python -m unittest discover -s tests -p test_mi_utf8_c.py -v
      - name: CLI protection and default output contract
        run: python -m unittest discover -s tests -p test_mi_integration.py -v
      - name: Source bridge UBSan (Linux fixture only)
        if: runner.os == 'Linux'
        env:
          MI_UBSAN: "1"
        run: python experiments/mi_source/test_source.py
      - name: NativeMemory UBSan (Linux fixture only)
        if: runner.os == 'Linux'
        env:
          MI_UBSAN: "1"
        run: python experiments/mi_borrow/test_bridge.py
      - name: UTF8 callback UBSan (Linux fixture only)
        if: runner.os == 'Linux'
        env:
          MI_UBSAN: "1"
        run: python -m unittest discover -s tests -p test_mi_utf8_c.py -v
