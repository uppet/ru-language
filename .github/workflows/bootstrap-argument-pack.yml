          from rulang.llvm_toolchain import LLVMToolchain
          ru=Path.cwd().resolve(); app=(ru.parent/'editor-bootstrap').resolve(); out=Path(os.environ['PACK_EVIDENCE']).resolve()
          def require(condition,message):
