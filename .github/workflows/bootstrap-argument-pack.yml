          def git(root,*args): return subprocess.check_output(['git','-C',str(root),*args],text=True,encoding='utf-8').strip()
          def pin(root,expected):
              actual=git(root,'rev-parse','HEAD'); require(actual==expected,'unexpected checkout HEAD: '+actual)
              require(not git(root,'status','--porcelain','--untracked-files=all'),'dirty source')
              return {'path':str(root),'commit':actual,'tree':git(root,'rev-parse','HEAD^{tree}')}
          language=pin(ru,os.environ['GITHUB_SHA']); editor=pin(app,os.environ['EDITOR_COMMIT'])
          require(editor['tree']==os.environ['EDITOR_TREE'],'unexpected editor tree')
          t=LLVMToolchain(); require(len(t.clang)==1,'unexpected compiler argv')
          tools={'clang':str(Path(t.clang[0]).resolve()),**{k:str(Path(v).resolve()) for k,v in t.tools.items()},
            'linker':str((Path(os.environ['VCToolsInstallDir'])/'bin/Hostx64/x64/link.exe').resolve()),
            'resource-compiler':str((Path(os.environ['WindowsSdkDir'])/'bin'/os.environ['WindowsSDKVersion'].rstrip('\\/')/'x64/rc.exe').resolve())}
          mingw=Path(os.environ['GUI_MSYS_ROOT'])/'mingw64/bin'
          native={k:str((mingw/v).resolve()) for k,v in {'cc':'gcc.exe','cxx':'g++.exe','make':'mingw32-make.exe','windres':'windres.exe','ar':'ar.exe','ranlib':'ranlib.exe','objdump':'objdump.exe'}.items()}
          def hashes(paths):
              result={}
              for key,value in paths.items():
                  p=Path(value); require(p.is_file() and not p.is_symlink(),'unsafe tool path: '+value)
                  result[key]=hashlib.sha256(p.read_bytes()).hexdigest()
              return result
          config={'schema':'ru-notepad-bootstrap-llvm-config-v1','ru_source':language,'app_source':editor,
            'app_baseline':{'commit':'d964ea9f7e27065aa5bbcced8d6c7526a6224dd1','tree':'2522d03114c808480e42911be850b75e0ae14206'},
            'bootstrap_directory':str(ru/'bin/bootstrap/pack-current'),'verification':str(ru/'bin/bootstrap/pack-current/verification.json'),
            'tool_paths':tools,'tool_sha256':hashes(tools),'mingw_tool_paths':native,'mingw_tool_sha256':hashes(native)}
          (out/'base-config.json').write_text(json.dumps(config,indent=2),encoding='utf-8')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f:
              f.write('RU_LLVM_CLANG='+tools['clang']+'\n')
              f.write('PATH='+str(mingw)+';'+os.environ['PATH']+'\n')
          '@ | python -
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Checkout immutable prior46c address-cache source without pack reuse
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: uppet/ru-language
          ref: 46c81ccfde815b8917be9107288b9a80b08758c9
          path: pack-old-language
          persist-credentials: false
      - name: Prepare only the fixed compiler artifact parent with reparse guards
        run: |
          @'
          from pathlib import Path
          from tools import bootstrap_pack_artifact as loader
          parent = Path.cwd() / 'bin' / 'bootstrap'
          output = parent / 'pack-current'
          for ancestor in (parent, *parent.parents):
              try:
                  ancestor.lstat()
              except FileNotFoundError:
                  continue
              loader.no_links(ancestor)
              loader.require(ancestor.is_dir(), 'artifact ancestor must be a directory')
          parent.mkdir(parents=True, exist_ok=True)
          loader.no_links(parent)
          loader.require(not output.exists() and not output.is_symlink(), 'artifact output must remain fresh')
          '@ | python -
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Download exact old46c and current successful Windows compiler evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python tools/bootstrap_pack_artifact.py old --output "$env:PACK_EVIDENCE/old-bootstrap" --receipt-output "$env:PACK_EVIDENCE/old-download-pin.json"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/bootstrap_pack_artifact.py current --output "$env:GITHUB_WORKSPACE/language/bin/bootstrap/pack-current" --receipt-output "$env:PACK_EVIDENCE/new-download-pin.json"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build identical pinned DLL dependencies for every measurement process
        run: python ../editor-bootstrap/tools/prepare_bootstrap_dependencies.py --config "$env:PACK_EVIDENCE/base-config.json" --output "$env:PACK_EVIDENCE/dependencies"
      - name: Freeze three-strategy build inputs with honest separate old source provenance
        run: |
          @'
          import hashlib,json,os
          from pathlib import Path
          root=Path.cwd().resolve(); out=Path(os.environ['PACK_EVIDENCE']).resolve()
          base=json.loads((out/'base-config.json').read_bytes())
          new={**base,'entry_source':'tests/bootstrap_pipeline/dll_abi_probe.ru'}
          old={**new,'ru_source':{'path':str((root.parent/'pack-old-language').resolve()),
            'commit':'46c81ccfde815b8917be9107288b9a80b08758c9','tree':'19c4199f3381bca19be01d5e703ef0b691ec7f8b'},
            'bootstrap_directory':str(out/'old-bootstrap'),'verification':str(out/'old-bootstrap/verification.json')}
          from tools.bootstrap_pack_build import MEASUREMENT_INPUTS
          names = MEASUREMENT_INPUTS
          def identity(p):
              raw=p.read_bytes(); return {'path':str(p),'sha256':hashlib.sha256(raw).hexdigest(),'size':len(raw)}
          config={'schema':'ru-bootstrap-pack-build-config-v1','editor_root':str((root.parent/'editor-bootstrap').resolve()),
            'owned_root':str(out/'builds'),'dependencies_receipt':str(out/'dependencies/dependencies-receipt.json'),
            'build_configs':{'A':old,'B':new},
            'artifact_receipts':{'A':json.loads((out/'old-download-pin.json').read_bytes()),'B':json.loads((out/'new-download-pin.json').read_bytes())},
            'measurement_inputs':[identity(root/name) for name in names]}
          (out/'build-config.json').write_text(json.dumps(config,indent=2),encoding='utf-8')
          '@ | python -
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build each complete strategy under its own strict 600 second aggregate watchdog
        run: python tools/bootstrap_pack_build.py --config "$env:PACK_EVIDENCE/build-config.json" --output "$env:PACK_EVIDENCE/builds/prepared.json"
      - name: Six balanced rounds all eighteen fixed 60 second owned-process observations
        run: python tools/measure_bootstrap_packs.py --prepared "$env:PACK_EVIDENCE/builds/prepared.json" --owned-root "$env:PACK_EVIDENCE/builds/samples" --output "$env:PACK_EVIDENCE/builds/samples/measurement.json"
      - name: Preserve all measurement JSON and logs including refused or incomplete observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bootstrap-pack-measurement-${{ github.sha }}
          path: |
            ${{ runner.temp }}/bootstrap-pack-measurement/**/*.json
            ${{ runner.temp }}/bootstrap-pack-measurement/**/*.log
          if-no-files-found: error
          retention-days: 14
